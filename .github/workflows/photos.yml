# Recherche de photos de plats (Wikimedia Commons) : voir photos-work/fetch.py
name: photos
on:
  push:
    branches: [claude/cuisine-app-web-w2te96]
    paths: [photos-work/request.json, photos-work/chosen.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: photos
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python photos-work/fetch.py
      - name: Enregistrer
        run: |
          git config user.name "photos-bot"
          git config user.email "photos-bot@users.noreply.github.com"
          mkdir -p cuisine-app/public/photos && git add -A photos-work cuisine-app/public
          git diff --cached --quiet || git commit -m "Photos : candidates / sélection depuis Wikimedia Commons"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
